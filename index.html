
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOLOCH</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: monospace;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #000;
}

#fog {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(ellipse at center,
        transparent 20%,
        rgba(0,0,0,.25) 65%,
        rgba(0,0,0,.9) 100%);
    animation: fog 12s ease-in-out infinite alternate;
}

@keyframes fog {
    from { opacity: .55; }
    to { opacity: 1; }
}

#cursors {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}

.moloch-cursor {
    position: absolute;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 12px currentColor;
    pointer-events: none;
}

.moloch-cursor::after {
    content: "";
    position: absolute;
    width: 22px;
    height: 22px;
    border: 1px solid currentColor;
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    opacity: .4;
}

#play-screen {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.75);
}

#play-button {
    color: white;
    background: transparent;
    border: 1px solid rgba(255,255,255,.5);
    padding: 14px 36px;
    font: inherit;
    font-size: 13px;
    letter-spacing: 5px;
    cursor: pointer;
    transition: .2s;
}

#play-button:hover {
    color: #ff303b;
    border-color: #ff303b;
    box-shadow: 0 0 25px rgba(255,48,59,.35);
}

#play-screen.hidden {
    display: none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>
<div id="fog"></div>
<div id="cursors"></div>

<div id="play-screen">
    <button id="play-button">PLAY</button>
</div>

<script type="module">
import { joinRoom } from "https://esm.run/trystero@0.27.0";

/* --------------------------------------------------
   MOLOCH MULTIPLAYER CONFIGURATION
-------------------------------------------------- */

const APP_ID = "moloch-global-multiplayer";
const ROOM_ID = "global";

let room = null;
let playerState = null;
let multiplayerStarted = false;

const remotePlayers = new Map();
const remoteCursors = new Map();

/* --------------------------------------------------
   CANVAS
-------------------------------------------------- */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const cursorsElement = document.getElementById("cursors");

let width = window.innerWidth;
let height = window.innerHeight;
let dpr = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resize);
resize();

/* --------------------------------------------------
   RANDOM PLAYER COLOR
-------------------------------------------------- */

const SIGILS = [
    [255, 80, 80],
    [80, 160, 255],
    [80, 255, 140],
    [255, 200, 80],
    [210, 100, 255],
    [255, 100, 190],
    [100, 230, 255],
    [220, 220, 220]
];

const myColorRGB = SIGILS[
    Math.floor(Math.random() * SIGILS.length)
];

const myColor = `rgb(${myColorRGB.join(",")})`;

function colorString(color) {
    if (!Array.isArray(color)) return "rgb(255,255,255)";
    return `rgb(${color[0]},${color[1]},${color[2]})`;
}

/* --------------------------------------------------
   DETERMINISTIC WORLD GENERATION

   Every browser generates the same houses.
-------------------------------------------------- */

function seededRandom(seed) {
    let value = seed;

    return function() {
        value = (value * 16807) % 2147483647;
        return (value - 1) / 2147483646;
    };
}

const random = seededRandom(666);

const houses = [];

for (let i = 0; i < 14; i++) {
    houses.push({
        x: 0.1 + random() * 0.8,
        y: 0.1 + random() * 0.8,
        r: 60,
        pulse: random() * 10,
        owner: null,
        intensity: 0
    });
}

/* --------------------------------------------------
   LOCAL PLAYER
-------------------------------------------------- */

const player = {
    x: 0.5,
    y: 0.5,
    vx: 0,
    vy: 0,
    color: myColorRGB,
    intensity: 1
};

let pointerX = 0.5;
let pointerY = 0.5;

let keys = {};

window.addEventListener("keydown", event => {
    const key = event.key.toLowerCase();

    if ([
        "arrowup",
        "arrowdown",
        "arrowleft",
        "arrowright",
        "w",
        "a",
        "s",
        "d"
    ].includes(key)) {
        event.preventDefault();
        keys[key] = true;
    }
});

window.addEventListener("keyup", event => {
    keys[event.key.toLowerCase()] = false;
});

window.addEventListener("blur", () => {
    keys = {};
});

window.addEventListener("pointermove", event => {
    pointerX = event.clientX / width;
    pointerY = event.clientY / height;
});

/* --------------------------------------------------
   MULTIPLAYER
-------------------------------------------------- */

async function startMultiplayer() {
    if (multiplayerStarted) return;

    multiplayerStarted = true;

    try {
        room = joinRoom(
            {
                appId: APP_ID,
                identity: "none"
            },
            ROOM_ID
        );

        room.onError(error => {
            console.error("MOLOCH multiplayer error:", error);
        });

        room.onUserJoin(({ userId }) => {
            console.log("MOLOCH player joined:", userId);
        });

        room.onUserLeave(({ userId }) => {
            removeRemotePlayer(userId);
        });

        playerState = room.makeUserState("moloch-player", {
            x: player.x,
            y: player.y,
            pointerX,
            pointerY,
            color: myColorRGB
        });

        playerState.onChange((data, metadata) => {
            const { userId, self, removed } = metadata;

            if (self) return;

            if (removed) {
                removeRemotePlayer(userId);
                return;
            }

            updateRemotePlayer(userId, data);
        });

        console.log("MOLOCH multiplayer initialized.");

    } catch (error) {
        console.error("MOLOCH connection failed:", error);
        multiplayerStarted = false;
    }
}

/* --------------------------------------------------
   REMOTE PLAYER MANAGEMENT
-------------------------------------------------- */

function updateRemotePlayer(userId, data) {
    if (!data) return;

    remotePlayers.set(userId, {
        x: Number(data.x) || 0,
        y: Number(data.y) || 0,
        color: data.color || [255,255,255]
    });

    let cursor = remoteCursors.get(userId);

    if (!cursor) {
        cursor = document.createElement("div");
        cursor.className = "moloch-cursor";
        cursorsElement.appendChild(cursor);
        remoteCursors.set(userId, cursor);
    }

    const px = Math.max(0, Math.min(1, Number(data.pointerX) || 0));
    const py = Math.max(0, Math.min(1, Number(data.pointerY) || 0));

    cursor.style.left = (px * width) + "px";
    cursor.style.top = (py * height) + "px";
    cursor.style.color = colorString(data.color);
    cursor.style.background = colorString(data.color);
}

function removeRemotePlayer(userId) {
    remotePlayers.delete(userId);

    const cursor = remoteCursors.get(userId);

    if (cursor) {
        cursor.remove();
        remoteCursors.delete(userId);
    }
}

/* --------------------------------------------------
   SEND PLAYER STATE
-------------------------------------------------- */

let lastStateUpdate = 0;

function sendPlayerState(timestamp) {
    if (!playerState) return;

    if (timestamp - lastStateUpdate < 50) return;

    lastStateUpdate = timestamp;

    playerState.set({
        x: player.x,
        y: player.y,
        pointerX,
        pointerY,
        color: myColorRGB
    });
}

/* --------------------------------------------------
   MOVEMENT
-------------------------------------------------- */

function updatePlayer() {
    const acceleration = 0.0018;
    const damping = 0.92;

    if (keys["arrowup"] || keys["w"]) {
        player.vy -= acceleration;
    }

    if (keys["arrowdown"] || keys["s"]) {
        player.vy += acceleration;
    }

    if (keys["arrowleft"] || keys["a"]) {
        player.vx -= acceleration;
    }

    if (keys["arrowright"] || keys["d"]) {
        player.vx += acceleration;
    }

    player.vx *= damping;
    player.vy *= damping;

    player.x += player.vx;
    player.y += player.vy;

    player.x = Math.max(0.015, Math.min(0.985, player.x));
    player.y = Math.max(0.015, Math.min(0.985, player.y));

    houses.forEach(house => {
        const dx = player.x * width - house.x * width;
        const dy = player.y * height - house.y * height;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < house.r) {
            house.owner = myColorRGB;
            house.intensity = Math.min(1, house.intensity + 0.02);
        } else {
            house.intensity *= 0.995;
        }
    });
}

/* --------------------------------------------------
   DRAWING
-------------------------------------------------- */

function drawBackground() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, width, height);
}

function drawHouses(time) {
    houses.forEach(house => {
        const x = house.x * width;
        const y = house.y * height;

        const pulse = Math.sin(time * 0.001 + house.pulse) * 5;
        const radius = house.r + pulse;

        let color = house.owner
            ? colorString(house.owner)
            : "rgba(255,255,255,.45)";

        ctx.save();

        ctx.shadowBlur = 20 + house.intensity * 30;
        ctx.shadowColor = color;

        ctx.strokeStyle = color;
        ctx.globalAlpha = 0.2 + house.intensity * 0.8;
        ctx.lineWidth = 1;

        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.globalAlpha *= 0.35;
        ctx.beginPath();
        ctx.arc(x, y, radius * 0.55, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = color;
        ctx.globalAlpha = 0.5 + house.intensity * 0.5;

        ctx.beginPath();
        ctx.arc(x, y, 2 + house.intensity * 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    });
}

function drawPlayer(x, y, color, local = false) {
    const px = x * width;
    const py = y * height;

    const rgb = colorString(color);

    ctx.save();

    ctx.shadowColor = rgb;
    ctx.shadowBlur = local ? 30 : 20;

    ctx.fillStyle = rgb;
    ctx.globalAlpha = 0.9;

    ctx.beginPath();
    ctx.arc(px, py, local ? 5 : 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = 0.3;
    ctx.strokeStyle = rgb;
    ctx.lineWidth = 1;

    ctx.beginPath();
    ctx.arc(px, py, local ? 15 : 12, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();
}

function drawConnections() {
    ctx.save();

    ctx.lineWidth = 0.5;
    ctx.globalAlpha = 0.12;

    remotePlayers.forEach(remote => {
        ctx.strokeStyle = colorString(remote.color);

        ctx.beginPath();
        ctx.moveTo(player.x * width, player.y * height);
        ctx.lineTo(remote.x * width, remote.y * height);
        ctx.stroke();
    });

    ctx.restore();
}

function render(time) {
    drawBackground();
    drawHouses(time);
    drawConnections();

    remotePlayers.forEach(remote => {
        drawPlayer(remote.x, remote.y, remote.color);
    });

    drawPlayer(player.x, player.y, player.color, true);
}

/* --------------------------------------------------
   MAIN LOOP
-------------------------------------------------- */

function loop(timestamp) {
    updatePlayer();
    render(timestamp);
    sendPlayerState(timestamp);

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* --------------------------------------------------
   PLAY
-------------------------------------------------- */

document.getElementById("play-button").addEventListener("click", async () => {
    document.getElementById("play-screen").classList.add("hidden");

    await startMultiplayer();
});

/* --------------------------------------------------
   AUTOMATIC DEPARTURE
-------------------------------------------------- */

window.addEventListener("pagehide", () => {
    if (room) {
        room.leave();
    }
});

</script>
</body>
</html>
