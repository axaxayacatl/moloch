
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOLOCH</title>

<style>
html,body{
  margin:0;
  overflow:hidden;
  background:black;
}

canvas{display:block}

#fog{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 50%,
      rgba(0,0,0,0.2),
      rgba(0,0,0,0.9)
    );
  mix-blend-mode:screen;
  opacity:0.8;
  animation:breathe 8s ease-in-out infinite;
}

@keyframes breathe{
  0%{transform:scale(1);}
  50%{transform:scale(1.05);}
  100%{transform:scale(1);}
}

/* Multiplayer cursors */

#moloch-cursors{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:10;
}

.moloch-cursor{
  position:absolute;
  width:9px;
  height:9px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  box-shadow:0 0 9px currentColor,0 0 20px currentColor;
  will-change:left,top;
}

/* Single Play control */

#play-screen{
  position:fixed;
  inset:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,0.12);
}

#play-button{
  appearance:none;
  background:rgba(0,0,0,0.65);
  border:1px solid rgba(255,255,255,0.55);
  color:white;
  padding:13px 32px;
  font-family:monospace;
  font-size:13px;
  letter-spacing:5px;
  cursor:pointer;
  transition:background .2s,border-color .2s;
}

#play-button:hover{
  background:rgba(255,255,255,0.12);
  border-color:white;
}

#play-button:focus-visible{
  outline:1px solid white;
  outline-offset:5px;
}
</style>
</head>

<body>

<div id="fog"></div>
<canvas id="c"></canvas>
<div id="moloch-cursors"></div>

<div id="play-screen">
  <button id="play-button" type="button">PLAY</button>
</div>

<script type="module">

import {joinRoom} from "https://esm.run/trystero@0.27.0";

/* =========================================
   MOLOCH
   Original game
   ========================================= */

const c=document.getElementById("c");
const x=c.getContext("2d");

function resize(){
  c.width=innerWidth;
  c.height=innerHeight;
}

addEventListener("resize",resize);
resize();

let player;
let houses=[];
let t0=Date.now();

function rand(a,b){
  return Math.random()*(b-a)+a;
}

const SIGILS=[
  [255,80,80],
  [80,160,255],
  [80,255,140],
  [255,200,80]
];

function spawn(){
  houses=[];

  for(let i=0;i<14;i++){
    houses.push({
      x:rand(100,c.width-100),
      y:rand(100,c.height-100),
      r:60,
      pulse:Math.random()*10,
      owner:null
    });
  }
}

function start(){
  player={
    x:c.width/2,
    y:c.height/2,
    vx:0,
    vy:0,
    sigil:Math.floor(Math.random()*4),
    intensity:0
  };

  spawn();
}

start();

/* =========================================
   CONTROLS
   ========================================= */

let keys={};

addEventListener("keydown",e=>{
  keys[e.key]=true;
});

addEventListener("keyup",e=>{
  keys[e.key]=false;
});

addEventListener("blur",()=>{
  keys={};
});

/* =========================================
   MULTIPLAYER CONFIGURATION
   ========================================= */

const APP_ID="axayacatl.neocities.org/moloch";
const ROOM_ID="global";

const cursorLayer=document.getElementById("moloch-cursors");

const myColor="#"+Math.floor(Math.random()*16777215)
  .toString(16).padStart(6,"0");

const localCursor=document.createElement("div");
localCursor.className="moloch-cursor";
localCursor.style.background=myColor;
localCursor.style.color=myColor;
cursorLayer.appendChild(localCursor);

let pointerX=innerWidth/2;
let pointerY=innerHeight/2;

addEventListener("pointermove",event=>{
  pointerX=event.clientX;
  pointerY=event.clientY;

  localCursor.style.left=pointerX+"px";
  localCursor.style.top=pointerY+"px";
},{passive:true});

localCursor.style.left=pointerX+"px";
localCursor.style.top=pointerY+"px";

/* =========================================
   PEER-TO-PEER WORLD
   ========================================= */

let room=null;
let sendPlayerState=null;
let multiplayerStarted=false;

const remotePlayers=new Map();

function createRemoteCursor(userId,color){
  if(remotePlayers.has(userId)){
    return remotePlayers.get(userId);
  }

  const cursor=document.createElement("div");
  cursor.className="moloch-cursor";

  cursor.style.background=color;
  cursor.style.color=color;

  cursorLayer.appendChild(cursor);

  const remote={
    id:userId,
    color,
    x:0.5,
    y:0.5,
    pointerX:0.5,
    pointerY:0.5,
    cursor
  };

  remotePlayers.set(userId,remote);

  return remote;
}

function removeRemotePlayer(userId){
  const remote=remotePlayers.get(userId);

  if(!remote)return;

  remote.cursor.remove();
  remotePlayers.delete(userId);
}

function receivePlayerState(data,meta){
  if(!data || !meta || !meta.userId)return;

  const userId=meta.userId;

  if(userId===localUserId)return;

  const remote=createRemoteCursor(
    userId,
    data.color||"#ffffff"
  );

  remote.color=data.color||remote.color;

  remote.x=data.x;
  remote.y=data.y;

  remote.pointerX=data.pointerX;
  remote.pointerY=data.pointerY;

  remote.cursor.style.background=remote.color;
  remote.cursor.style.color=remote.color;

  remote.cursor.style.left=
    (remote.pointerX*innerWidth)+"px";

  remote.cursor.style.top=
    (remote.pointerY*innerHeight)+"px";
}

let localUserId=null;

function sendState(){
  if(!sendPlayerState)return;

  sendPlayerState({
    x:player.x/c.width,
    y:player.y/c.height,

    pointerX:pointerX/innerWidth,
    pointerY:pointerY/innerHeight,

    color:myColor,
    sigil:player.sigil
  });
}

async function enterMultiplayer(){

  if(multiplayerStarted)return;

  multiplayerStarted=true;

  document.getElementById("play-screen").remove();

  t0=Date.now();

  try{

    /*
      Trystero uses public Nostr relays for discovery
      and WebRTC data channels for direct gameplay.
    */

    room=joinRoom(
      {
        appId:APP_ID,
        identity:"none"
      },
      ROOM_ID,
      {
        onJoinError:({peerId,error})=>{
          console.warn("MOLOCH peer connection error:",peerId,error);
        }
      }
    );

    const identity=await room.getSelf();
    localUserId=identity.userId;

    const stateAction=room.makeAction("moloch-player-state");

    sendPlayerState=stateAction.send;

    stateAction.onMessage((data,meta)=>{
      receivePlayerState(data,meta);
    });

    /*
      Existing players announce their current state
      when another player joins.
    */

    room.onUserJoin(({userId})=>{
      sendState();
    });

    /*
      Remove remote cursors when a player leaves.
    */

    room.onUserLeave(({userId})=>{
      removeRemotePlayer(userId);
    });

    room.onError(error=>{
      console.warn("MOLOCH multiplayer:",error);
    });

    sendState();

  }catch(error){

    console.error("MOLOCH multiplayer initialization failed:",error);

    multiplayerStarted=false;

  }
}

/* =========================================
   PLAY
   ========================================= */

document.getElementById("play-button").addEventListener(
  "click",
  enterMultiplayer
);

/* =========================================
   ORIGINAL GAME UPDATE
   ========================================= */

function update(){

  let t=(Date.now()-t0)/9000;

  if(t>1){
    t0=Date.now();
    spawn();
  }

  let a=0.18;

  if(keys["ArrowUp"])player.vy-=a;
  if(keys["ArrowDown"])player.vy+=a;
  if(keys["ArrowLeft"])player.vx-=a;
  if(keys["ArrowRight"])player.vx+=a;

  player.vx*=0.92;
  player.vy*=0.92;

  player.x+=player.vx;
  player.y+=player.vy;

  player.x=Math.max(0,Math.min(c.width,player.x));
  player.y=Math.max(0,Math.min(c.height,player.y));

  player.intensity*=0.95;

  for(let h of houses){

    let dx=player.x-h.x;
    let dy=player.y-h.y;
    let d=Math.hypot(dx,dy);

    if(d<h.r){
      h.owner=true;
      player.intensity=Math.min(
        1,
        player.intensity+0.08
      );
    }
  }

  return t;
}

/* =========================================
   ORIGINAL VISUAL EFFECTS
   ========================================= */

function glow(x0,y0,r,color,alpha){

  let g=x.createRadialGradient(
    x0,y0,0,
    x0,y0,r
  );

  g.addColorStop(0,`rgba(${color},${alpha})`);
  g.addColorStop(1,"rgba(0,0,0,0)");

  x.fillStyle=g;
  x.beginPath();
  x.arc(x0,y0,r,0,7);
  x.fill();
}

function aura(x0,y0,color,intensity){

  for(let i=0;i<3;i++){

    glow(
      x0+(Math.random()-0.5)*10*intensity,
      y0+(Math.random()-0.5)*10*intensity,
      80+Math.random()*40,
      color.join(","),
      0.12*intensity
    );

  }
}

/* =========================================
   DRAW
   ========================================= */

function draw(t){

  x.fillStyle="rgba(0,0,0,0.22)";
  x.fillRect(0,0,c.width,c.height);

  for(let h of houses){

    let pulse=60+Math.sin(t*6+h.pulse)*10;

    glow(
      h.x,h.y,
      pulse,
      h.owner?"0,255,140":"200,200,255",
      h.owner?0.18:0.06
    );

  }

  let sig=SIGILS[player.sigil];

  aura(
    player.x,
    player.y,
    sig,
    player.intensity+0.5
  );

  x.fillStyle=`rgb(${sig[0]},${sig[1]},${sig[2]})`;
  x.beginPath();
  x.arc(player.x,player.y,3,0,7);
  x.fill();

  /*
    Remote players appear in the same world
    using their individually assigned colors.
  */

  for(const remote of remotePlayers.values()){

    const rx=remote.x*c.width;
    const ry=remote.y*c.height;

    x.save();

    x.fillStyle=remote.color;
    x.shadowColor=remote.color;
    x.shadowBlur=15;

    x.beginPath();
    x.arc(rx,ry,4,0,Math.PI*2);
    x.fill();

    x.restore();

  }

  x.strokeStyle="rgba(255,255,255,0.03)";

  for(let i=0;i<6;i++){

    x.beginPath();

    x.moveTo(
      0,
      Math.sin(t*3+i)*c.height
    );

    x.lineTo(
      c.width,
      Math.cos(t*2+i)*c.height
    );

    x.stroke();

  }

}

/* =========================================
   MAIN LOOP
   ========================================= */

let lastNetworkUpdate=0;

function loop(){

  requestAnimationFrame(loop);

  let t=update();

  draw(t);

  /*
    20 updates per second per player.
    Gameplay data travels directly through
    WebRTC connections.
  */

  if(multiplayerStarted && sendPlayerState){

    const now=performance.now();

    if(now-lastNetworkUpdate>=50){

      lastNetworkUpdate=now;
      sendState();

    }

  }

}

loop();

/* =========================================
   DISCONNECT ON EXIT
   ========================================= */

addEventListener("pagehide",()=>{
  if(room){
    room.leave();
    room=null;
  }
});

</script>

</body>
</html>
