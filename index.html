<doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="license" content="MIT">
<title>MOLOCH</title>

<style>
html,body{
  margin:0;
  overflow:hidden;
  background:black;
}

canvas{display:block}

#fog{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 50%,
      rgba(0,0,0,0.2),
      rgba(0,0,0,0.9)
    );
  mix-blend-mode:screen;
  opacity:0.8;
  animation:breathe 8s ease-in-out infinite;
}

@keyframes breathe{
  0%{transform:scale(1);}
  50%{transform:scale(1.05);}
  100%{transform:scale(1);}
}

/* Multiplayer cursors */
#moloch-cursors{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:10;
}

.moloch-cursor{
  position:absolute;
  width:10px;
  height:10px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  will-change:left,top;
  box-shadow:0 0 8px currentColor,0 0 18px currentColor;
}
</style>
</head>

<body>

<div id="fog"></div>
<canvas id="c"></canvas>
<div id="moloch-cursors"></div>

<script>
"use strict";

/* =========================================
   MOLOCH
   Original gameplay and rendering
   ========================================= */

const c=document.getElementById("c");
const x=c.getContext("2d");

function resize(){
  c.width=innerWidth;
  c.height=innerHeight;
}

addEventListener("resize",resize);
resize();

let player;
let houses=[];
let t0=Date.now();

function rand(a,b){
  return Math.random()*(b-a)+a;
}

const SIGILS=[
  [255,80,80],
  [80,160,255],
  [80,255,140],
  [255,200,80]
];

function spawn(){
  houses=[];

  for(let i=0;i<14;i++){
    houses.push({
      x:rand(100,c.width-100),
      y:rand(100,c.height-100),
      r:60,
      pulse:Math.random()*10,
      owner:null
    });
  }
}

function start(){
  player={
    x:c.width/2,
    y:c.height/2,
    vx:0,
    vy:0,
    sigil:Math.floor(Math.random()*4),
    intensity:0
  };

  spawn();
}

start();

/* =========================================
   CONTROLS
   ========================================= */

let keys={};

addEventListener("keydown",e=>{
  keys[e.key]=true;

  if([
    "ArrowUp",
    "ArrowDown",
    "ArrowLeft",
    "ArrowRight"
  ].includes(e.key)){
    e.preventDefault();
  }
});

addEventListener("keyup",e=>{
  keys[e.key]=false;
});

addEventListener("blur",()=>{
  keys={};
});

/* =========================================
   MULTIPLAYER
   Automatic same-origin synchronization
   No lobby, buttons, or interface
   ========================================= */

const MULTIPLAYER_CHANNEL="moloch-world-v1";

const multiplayer={
  id:(
    typeof crypto!=="undefined" && crypto.randomUUID
      ? crypto.randomUUID()
      : Math.random().toString(36).slice(2)+Date.now()
  ),

  color:`hsl(${Math.floor(Math.random()*360)},100%,65%)`,

  channel:null,
  players:new Map(),

  pointer:{
    x:0.5,
    y:0.5
  },

  lastSent:0
};

const cursorLayer=document.getElementById("moloch-cursors");

if("BroadcastChannel" in window){

  multiplayer.channel=new BroadcastChannel(MULTIPLAYER_CHANNEL);

  multiplayer.channel.addEventListener("message",event=>{
    const data=event.data;

    if(!data || data.id===multiplayer.id) return;

    if(data.type==="leave"){
      removeRemotePlayer(data.id);
      return;
    }

    if(data.type!=="state") return;

    let remote=multiplayer.players.get(data.id);

    if(!remote){
      const cursor=document.createElement("div");

      cursor.className="moloch-cursor";
      cursor.style.background=data.color || "#ffffff";
      cursor.style.color=data.color || "#ffffff";

      cursorLayer.appendChild(cursor);

      remote={
        id:data.id,
        color:data.color || "#ffffff",
        cursor,
        x:0.5,
        y:0.5,
        playerX:0.5,
        playerY:0.5,
        lastSeen:Date.now()
      };

      multiplayer.players.set(data.id,remote);
    }

    remote.color=data.color || remote.color;
    remote.x=data.pointerX ?? remote.x;
    remote.y=data.pointerY ?? remote.y;
    remote.playerX=data.playerX ?? remote.playerX;
    remote.playerY=data.playerY ?? remote.playerY;
    remote.lastSeen=Date.now();

    remote.cursor.style.background=remote.color;
    remote.cursor.style.color=remote.color;

    remote.cursor.style.left=(remote.x*innerWidth)+"px";
    remote.cursor.style.top=(remote.y*innerHeight)+"px";
  });

}

function removeRemotePlayer(id){
  const remote=multiplayer.players.get(id);

  if(!remote) return;

  remote.cursor.remove();
  multiplayer.players.delete(id);
}

/* Track the local pointer without affecting movement. */

addEventListener("pointermove",event=>{
  multiplayer.pointer.x=event.clientX/innerWidth;
  multiplayer.pointer.y=event.clientY/innerHeight;
},{passive:true});

/* Send player and pointer positions. */

function sendMultiplayerState(force=false){
  if(!multiplayer.channel) return;

  const now=performance.now();

  if(!force && now-multiplayer.lastSent<40) return;

  multiplayer.lastSent=now;

  multiplayer.channel.postMessage({
    type:"state",
    id:multiplayer.id,
    color:multiplayer.color,

    pointerX:multiplayer.pointer.x,
    pointerY:multiplayer.pointer.y,

    playerX:player.x/c.width,
    playerY:player.y/c.height,

    timestamp:Date.now()
  });
}

/* Remove players who have stopped sending updates. */

setInterval(()=>{
  const now=Date.now();

  for(const [id,remote] of multiplayer.players){
    if(now-remote.lastSeen>5000){
      removeRemotePlayer(id);
    }
  }

  sendMultiplayerState(true);
},1000);

/* Announce this player immediately. */

sendMultiplayerState(true);

addEventListener("pagehide",()=>{
  if(multiplayer.channel){
    multiplayer.channel.postMessage({
      type:"leave",
      id:multiplayer.id
    });

    multiplayer.channel.close();
  }
});

/* =========================================
   ORIGINAL GAME UPDATE
   ========================================= */

function update(){
  let t=(Date.now()-t0)/9000;

  if(t>1){
    t0=Date.now();
    spawn();
  }

  let a=0.18;

  if(keys["ArrowUp"]) player.vy-=a;
  if(keys["ArrowDown"]) player.vy+=a;
  if(keys["ArrowLeft"]) player.vx-=a;
  if(keys["ArrowRight"]) player.vx+=a;

  player.vx*=0.92;
  player.vy*=0.92;

  player.x+=player.vx;
  player.y+=player.vy;

  player.x=Math.max(0,Math.min(c.width,player.x));
  player.y=Math.max(0,Math.min(c.height,player.y));

  player.intensity*=0.95;

  for(let h of houses){
    let dx=player.x-h.x;
    let dy=player.y-h.y;
    let d=Math.hypot(dx,dy);

    if(d<h.r){
      h.owner=true;
      player.intensity=Math.min(1,player.intensity+0.08);
    }
  }

  sendMultiplayerState();

  return t;
}

/* =========================================
   ORIGINAL VISUAL EFFECTS
   ========================================= */

function glow(x0,y0,r,color,alpha){
  let g=x.createRadialGradient(x0,y0,0,x0,y0,r);

  g.addColorStop(0,`rgba(${color},${alpha})`);
  g.addColorStop(1,"rgba(0,0,0,0)");

  x.fillStyle=g;
  x.beginPath();
  x.arc(x0,y0,r,0,7);
  x.fill();
}

function aura(x0,y0,color,intensity){
  for(let i=0;i<3;i++){
    glow(
      x0+(Math.random()-0.5)*10*intensity,
      y0+(Math.random()-0.5)*10*intensity,
      80+Math.random()*40,
      color.join(","),
      0.12*intensity
    );
  }
}

/* =========================================
   ORIGINAL DRAWING + REMOTE PLAYERS
   ========================================= */

function draw(t){

  x.fillStyle="rgba(0,0,0,0.22)";
  x.fillRect(0,0,c.width,c.height);

  for(let h of houses){
    let pulse=60+Math.sin(t*6+h.pulse)*10;

    glow(
      h.x,h.y,
      pulse,
      h.owner?"0,255,140":"200,200,255",
      h.owner?0.18:0.06
    );
  }

  let sig=SIGILS[player.sigil];

  aura(player.x,player.y,sig,player.intensity+0.5);

  x.fillStyle=`rgb(${sig[0]},${sig[1]},${sig[2]})`;
  x.beginPath();
  x.arc(player.x,player.y,3,0,7);
  x.fill();

  x.strokeStyle="rgba(255,255,255,0.03)";

  for(let i=0;i<6;i++){
    x.beginPath();
    x.moveTo(0,Math.sin(t*3+i)*c.height);
    x.lineTo(c.width,Math.cos(t*2+i)*c.height);
    x.stroke();
  }

  /* Remote player markers.
     Each player has an independently assigned color. */

  for(const remote of multiplayer.players.values()){

    const rx=remote.playerX*c.width;
    const ry=remote.playerY*c.height;

    x.save();

    x.shadowBlur=14;
    x.shadowColor=remote.color;
    x.fillStyle=remote.color;

    x.beginPath();
    x.arc(rx,ry,3,0,Math.PI*2);
    x.fill();

    x.restore();
  }
}

/* =========================================
   MAIN LOOP
   ========================================= */

function loop(){
  requestAnimationFrame(loop);

  let t=update();
  draw(t);
}

loop();

</script>
</body>
</html>
